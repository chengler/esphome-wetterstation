# Zugangsdaten zum WLAN Zuhause
# Vorlage: kopieren und umbenennen in secrets.yaml

wifi_ssid: "XXX"
wifi_psk: "xyz"

# Passwort für den Access-Point, den der ESP aufmacht, wenn er sich nicht
# mit dem konfigurierten WLAN verbinden kann (WPA2: mindestens 8 Zeichen)
fallback_psk: "mindestens8"

# Einmalig auf Windows (kurzer Toolchain-Pfad, sonst Build-Fehler):
# setx ESPHOME_ESP_IDF_PREFIX C:\ESPHome\idf

# ESPHome aktualisieren
# python.exe -m pip install -U esphome

# validieren, ohne zu kompilieren:
# python.exe -m esphome config .\firmware.yaml

# kompilieren
# python.exe -m esphome compile .\firmware.yaml

# kompilieren und gleich aufspielen
# python.exe -m esphome run .\firmware.yaml