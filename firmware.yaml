substitutions:
  # Firmware-Version (wird in esphome/project/version übernommen)
  fw_version: "1.3"            # 1.3: Heizen zeitgesteuert per SNTP (30 s nach :00/:15/:30/:45)
  # Heiz-Automatik SHT45, zweistufig (Startwerte, im Betrieb anpassen)
  # Geheizt wird nur in 15-min-Slots, jeweils 30 s nach :00/:15/:30/:45 (time-Block, 1a)
  # heat_slots_*: in jedem wievielten Slot geheizt wird (1 = jeder Slot = 15 min, 2 = 30 min)
  # Stufe niedrig: Creep vorbeugen (Datenblatt 2.3: Drift bei längerer Zeit > 80 %RH)
  heat_rh_low: "80"            # Feuchte-Schwelle in %RH
  heat_slots_low: "2"          # jeder 2. Slot (30 min)
  heat_cmd_low: "0x2F"         # Heizbefehl 110 mW, ca. 1 s
  heat_mw_low: "110"           # Leistung zu heat_cmd_low in mW (muss zum Befehl passen)
  heat_ms_low: "1000"          # Dauer zu heat_cmd_low in ms (muss zum Befehl passen)
  # Stufe hoch: Kondenswasser entfernen (Nebel, Tau)
  # 1.2: schwächer (vorher 0x39 / 200 mW) – Feuchte sackte nach jedem Puls 2–3 %RH ab
  heat_rh_high: "95"           # Feuchte-Schwelle in %RH
  heat_slots_high: "1"         # jeder Slot (15 min)
  heat_cmd_high: "0x2F"        # Heizbefehl 110 mW, ca. 1 s
  heat_mw_high: "110"          # Leistung zu heat_cmd_high in mW (muss zum Befehl passen)
  heat_ms_high: "1000"         # Dauer zu heat_cmd_high in ms (muss zum Befehl passen)
  # MQTT-Heizbefehl (Abschnitt 1b)
  heat_pause_mqtt_ms: "50000"  # Sperrzeit nach einem Heizpuls für MQTT-Befehle in ms (50 sec, Startwert)
# Verbindung zum WLAN
wifi:
  use_address: wetter-nord.internal   # Hostname für OTA-Updates (mdns ist aus, daher nötig)
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_psk

  # Stromsparmodus WLAN:
  # NONE   geringste Einsparung, stabilste Verbindung
  # LIGHT  Mittelweg (Default ESP32)
  # HIGH   größte Einsparung, laut Doku häufigere Verbindungsabbrüche
  power_save_mode: LIGHT

  # Fallback-Hotspot, falls die WLAN-Verbindung fehlschlägt
  # https://esphome.io/components/wifi.html#access-point-mode
  ap:
    ssid: "wetter-nord-fallback"
    password: !secret fallback_psk

mdns:
  disabled: true

mqtt:
  id: mqtt_client              # nötig, um aus dem Lambda zu publizieren
  broker: venus.internal
  discovery: false             # keine Home-Assistant-Discovery-Topics (kein HA im Einsatz)
  topic_prefix: wetter/nord
  log_topic: null              # keine Logs per MQTT (Logs über Web-UI)

  # 1b) Heizbefehl per MQTT (manuell, z.B. für Tests aus Node-RED)
  #     Befehl:   wetter/nord/sht45/heater/set    {"power":"high","time":"long"}
  #               power: low | med | high, time: short | long, retain: false senden!
  #     Antwort:  wetter/nord/sht45/heater/state  {"cmd":"0x39","power":"high","time":"long",
  #                                                "mw":200,"ms":1000,"source":"mqtt","result":"ok"}
  #               result: ok | invalid | locked | i2c_error
  #     Ereignis: wetter/nord/sht45/heater/event  {"mw":200,"ms":1000,"source":"mqtt"}
  #               nur bei tatsächlichem Heizpuls (result ok), gleiches Topic wie Automatik 1a
  on_json_message:
    - topic: wetter/nord/sht45/heater/set
      qos: 0
      then:
        - lambda: |-
            // x = empfangene JSON-Payload
            std::string power = x["power"] | "";    // fehlt das Feld: leerer String
            std::string dur   = x["time"]  | "";    // "dur" statt "time" (Namenskonflikt mit time())

            // Befehl aus Leistung und Dauer bestimmen (Datenblatt Tabelle 7)
            uint8_t cmd = 0;                        // 0 = ungültige Kombination
            uint16_t mw = 0, ms = 0;                // physikalische Werte für die Antwort
            bool lng = (dur == "long");
            if (dur == "long" || dur == "short") {
              ms = lng ? 1000 : 100;
              if (power == "high")     { mw = 200; cmd = lng ? 0x39 : 0x32; }
              else if (power == "med") { mw = 110; cmd = lng ? 0x2F : 0x24; }
              else if (power == "low") { mw = 20;  cmd = lng ? 0x1E : 0x15; }
            }

            // Prüfen und senden
            std::string result;
            uint32_t now = millis();
            if (cmd == 0) {
              result = "invalid";                   // unbekannte Leistung oder Dauer
            } else if (id(last_heat_ms) != 0 && now - id(last_heat_ms) < ${heat_pause_mqtt_ms}) {
              result = "locked";                    // Sperrzeit nach letztem Puls (auch Automatik 1a)
            } else if (id(sht45_raw).write(&cmd, 1) == i2c::ERROR_OK) {
              id(last_heat_ms) = now;               // gemeinsame Zeitmarke mit der Automatik 1a
              result = "ok";
              ESP_LOGI("sht45_heater", "Heizpuls 0x%02X per MQTT", cmd);
              id(heat_event).execute(mw, ms, std::string("mqtt"));   // NEU 1.1: Heizereignis melden
            } else {
              result = "i2c_error";                 // Sensor hat den Befehl nicht angenommen
            }

            // Rückmeldung publizieren (nicht retained)
            char hex[5];
            snprintf(hex, sizeof(hex), "0x%02X", cmd);
            id(mqtt_client).publish_json("wetter/nord/sht45/heater/state", [=](JsonObject root) {
              root["cmd"] = hex;
              root["power"] = power;
              root["time"] = dur;
              root["mw"] = mw;
              root["ms"] = ms;
              root["source"] = "mqtt";
              root["result"] = result;
            });

#### Grundkonfiguration abgeschlossen :) ####

# https://esphome.io/components/esphome.html
esphome:
  # Name: nur Kleinbuchstaben, Ziffern, Bindestrich
  name: "wetter-nord"                 # = DHCP-Hostname, nach Funktion statt Chip benannt
  friendly_name: "Wetter Nordseite"
  project:
    name: "cen.esphome-wetterstation"
    version: "${fw_version}"          # Version zentral oben in den substitutions pflegen
  comment: "https://github.com/chengler/esphome-wetterstation"
  # Beim Start Version und Build einmalig publizieren
  on_boot:
    - lambda: |-
        // Projekt-Version aus esphome/project/version
        id(fw_version).publish_state(ESPHOME_PROJECT_VERSION);
        // Zeitpunkt des Kompilierens, z.B. "Oct 23 2026 17:20:00"
        id(fw_build).publish_state(__DATE__ " " __TIME__);
# Firmware-Info auf MQTT-Ebene von status (wetter/nord/version, wetter/nord/build)
text_sensor:
  # 1) Version
  - platform: template
    id: fw_version
    name: "Version"
    update_interval: never                # Wert kommt nur aus on_boot
    entity_category: diagnostic           # Web-UI: Gruppe Diagnostic
    icon: "mdi:tag"                       # Etikett-Symbol für die Version
    web_server:
      sorting_weight: 10                  # ganz oben in Diagnostic  
    state_topic: wetter/nord/version      # eigener Topic statt .../text_sensor/.../state
  # 2) Build
  - platform: template
    id: fw_build
    name: "Build"
    update_interval: never
    entity_category: diagnostic
    icon: "mdi:calendar-clock"       # Kalender mit Uhr für den Build-Zeitpunkt
    web_server:
      sorting_weight: 20    
    state_topic: wetter/nord/build


# https://esphome.io/components/esp32.html
esp32:
  board: esp32-s2-saola-1      # generisches ESP32-S2-Board, passt für QT Py ESP32-S2 (4 MB Flash)
  variant: esp32s2

# Logging aktivieren
# https://esphome.io/components/logger.html
logger:
  level: DEBUG
  logs:
    sensor: INFO

# Web-Oberfläche (HTTP) aktivieren
web_server:
  port: 80
  # Version 3: Web-Components, interaktivere Oberfläche
  version: 3

# Updates über WLAN (OTA) erlauben
# https://esphome.io/components/ota.html
ota:
  - platform: esphome

# I2C-Bus aktivieren
# https://esphome.io/components/i2c.html
# QT Py ESP32-S2: STEMMA-QT-Buchse = zweiter I2C-Bus SDA1/SCL1
# STEMMA-QT-Pins der QT-Py-Boards (bei Board-Wechsel anpassen):
#   QT Py ESP32-S2 oder S3     SDA1 = GPIO41, SCL1 = GPIO40
#   QT Py ESP32 Pico           SDA1 = GPIO22, SCL1 = GPIO19
i2c:
  sda: GPIO41
  scl: GPIO40
  scan: true                   # listet gefundene Adressen beim Boot im Log

# Zeitpunkt des letzten Heizpulses (für die Sperrzeit der MQTT-Befehle 1b, gilt für Automatik und MQTT)
globals:
  - id: last_heat_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'        # 0 = seit Boot noch nicht geheizt

# NEU 1.1: Heizereignis melden (gemeinsam für Automatik 1a und MQTT-Befehl 1b)
# Topic:   wetter/nord/sht45/heater/event (nicht retained)
# Payload: {"mw":200,"ms":1000,"source":"auto"|"mqtt"}
#          mw = Heizleistung, ms = Heizdauer, Energie = mw * ms (in µJ)
# Doku: https://esphome.io/components/script/
script:
  - id: heat_event
    parameters:
      mw: int
      ms: int
      source: string
    then:
      - mqtt.publish_json:
          topic: wetter/nord/sht45/heater/event
          retain: false
          payload: |-
            root["mw"] = mw;
            root["ms"] = ms;
            root["source"] = source;

# NEU 1.3: Uhrzeit per SNTP aus dem eigenen Netz
# Doku: https://esphome.io/components/time/sntp/
# Zeitgesteuerte Auslöser (on_time) feuern nur mit gültiger Uhrzeit.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - !secret ntp_server     # Zeitserver im eigenen Netz, steht in secrets.yaml
    on_time:
      # 1a) Heiz-Automatik (ab 1.3 zeitgesteuert statt nach Mindestpause)
      #     läuft 30 s nach :00/:15/:30/:45 → kurz nach dem 15-min-Snapshot in Node-RED,
      #     bis zum nächsten Snapshot bleiben fast 15 min zum Erholen der Feuchte
      #     zweistufig: ab heat_rh_low schwach/selten, ab heat_rh_high öfter
      #     jeder Heizpuls wird auf .../sht45/heater/event gemeldet (source "auto")
      - seconds: 30
        minutes: /15
        then:
          - lambda: |-
              // 1) letzte gemessene Feuchte des SHT45 holen
              float rh = id(sht45_hum).state;
              if (isnan(rh)) return;                                 // seit Boot noch keine Messung

              // 2) Slot-Nummer des Tages (0..95), ein Slot = 15 min
              auto t = id(sntp_time).now();
              int slot = (t.hour * 60 + t.minute) / 15;

              // 3) Stufe nach Feuchte wählen, nur in passenden Slots heizen
              uint8_t cmd;                                           // Heizbefehl der gewählten Stufe
              int mw, ms;                                            // Werte für die Ereignismeldung
              if (rh >= ${heat_rh_high}) {                           // Stufe hoch: Kondenswasser
                if (slot % ${heat_slots_high} != 0) return;
                cmd = ${heat_cmd_high};
                mw = ${heat_mw_high};
                ms = ${heat_ms_high};
              } else if (rh >= ${heat_rh_low}) {                     // Stufe niedrig: Creep
                if (slot % ${heat_slots_low} != 0) return;
                cmd = ${heat_cmd_low};
                mw = ${heat_mw_low};
                ms = ${heat_ms_low};
              } else {
                return;                                              // unter beiden Schwellen: nichts tun
              }

              // 4) Heizbefehl senden (1 Byte), Zeitmarke setzen, Ereignis melden
              if (id(sht45_raw).write(&cmd, 1) == i2c::ERROR_OK) {
                id(last_heat_ms) = millis();                         // Sperrzeit für MQTT-Befehle 1b
                ESP_LOGI("sht45_heater", "Heizpuls 0x%02X bei %.1f %%RH (Slot %d)", cmd, rh, slot);
                id(heat_event).execute(mw, ms, std::string("auto"));
              }

# Zweiter Zugriff auf den SHT45 (gleiche Adresse), nur um den Heizbefehl selbst zu senden
# Doku: https://esphome.io/components/i2c_device/
i2c_device:
  id: sht45_raw
  address: 0x44

sensor:
  # 1) SHT45 – Feuchte + Temperatur
  # Doku: https://esphome.io/components/sensor/sht4x/
  # I2C-Adresse: 0x44 (SHT45-AD1B, Default)
  # 1a) Heiz-Automatik: im time-Block (on_time), ab 1.3 zeitgesteuert
  # 1b) Heizbefehl per MQTT: im mqtt-Block (on_json_message muss dort stehen)
  - platform: sht4x
    id: sht45
    address: 0x44
    precision: High            # Default High
    heater_max_duty: 0.0       # MUSS 0 bleiben: Heizen übernimmt die Automatik 1a
    update_interval: 60s
    humidity:
      id: sht45_hum            # NEU 1.3: wird von der Heiz-Automatik 1a gelesen
      name: "Humidity"
      accuracy_decimals: 1     # 1 Nachkommastelle (Default 2), Genauigkeit ±1 %RH
      web_server:
        sorting_weight: 20 
    temperature:
      name: "SHT45 Temperature"
      entity_category: diagnostic # kennzeichnet ihn als Nebenwert (die Web-UI gruppiert ihn dann getrennt).
      # internal: true unterdrückt Web-UI und MQTT, der Wert bleibt nur intern im ESP.
      web_server:
        sorting_weight: 30
      icon: "mdi:water-percent"    # Tropfen-Symbol, Temperatur Feuchtesensor      

  # 2) DPS310 – Luftdruck + Temperatur
  # Doku: https://esphome.io/components/sensor/dps310/
  # I2C-Adresse: 0x77 (Default) | 0x76
  - platform: dps310
    id: dps310_baro            # "dps310" ist als ID verboten (= Integrationsname)
    address: 0x77
    update_interval: 60s
    pressure:
      name: "Pressure"
      accuracy_decimals: 2     # 2 Nachkommastellen (Default 1), relative Genauigkeit ±0,06 hPa
      web_server:
        sorting_weight: 30    # zuletzt: Druck
    temperature:
      name: "DPS310 Temperature"
      entity_category: diagnostic # kennzeichnet ihn als Nebenwert (die Web-UI gruppiert ihn dann getrennt).
      web_server:
        sorting_weight: 40
      icon: "mdi:gauge"            # Manometer-Symbol, Temperatur vom Drucksensor
      # internal: true unterdrückt Web-UI und MQTT, der Wert bleibt nur intern im ESP.

  # 3) TMP117 – Präzisions-Temperatur (Referenzwert für Außentemperatur)
  # Doku: https://esphome.io/components/sensor/tmp117/
  # I2C-Adresse: 0x48 (Default, ADDR an GND) | 0x49 (VCC) | 0x4A (SDA) | 0x4B (SCL)
  # Werkskalibrierung NIST-rückführbar; Mittelung setzt ESPHome automatisch (s. update_interval)
  - platform: tmp117
    id: tmp117_temp
    address: 0x48              # optional, nur nötig wenn ≠ Default
    name: "Temperature"
    web_server:
      sorting_weight: 10      # oben: Hauptwert
    device_class: temperature   # Web-UI wählt das Thermometer-Symbol über die Geräteklasse
    icon: "mdi:thermometer"     # Fallback: Symbol explizit setzen, falls die Klasse allein nicht reicht
    accuracy_decimals: 2       # 2 Nachkommastellen (Default 1), Chip-Auflösung 0,0078 °C
    update_interval: 60s       # Default 60s; ESPHome setzt danach die max. Mittelung im Sensor
    # Offset-Korrektur in °C, wird auf jeden Messwert addiert
    # 0.0 = keine Korrektur; erst nach Vergleich mit Referenz (DWD/geeichtes Thermometer) ändern
    # Beispiel: misst 0,15 °C zu hoch → offset: -0.15
    filters:
      - offset: 0.0